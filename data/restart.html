<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>ESP32 Restart</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>
<div class="container">

    <section class="card">
        <h1>ESP32 is restarting</h1>

        <div class="info">
            Please wait a few seconds. The device will reconnect
            to the saved Wi-Fi network.
        </div>

        <p>
            If you changed the Wi-Fi settings, the device IP
            address may also change.
        </p>
    </section>

</div>
</body>
</html>
