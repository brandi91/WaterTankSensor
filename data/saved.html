<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <meta
        http-equiv="refresh"
        content="15; url=/">

    <title>Configuration Saved</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>
<div class="container">

    <section class="card">
        <h1>Configuration Saved</h1>

        <div class="success">
            The settings were saved successfully.
            Pin configuration saved. Restart required.
        </div>

        <div class="warning">
            Wi-Fi and MQTT changes become fully active after
            a restart.
        </div>

        <p>
            You will return to the dashboard automatically
            in 15 seconds.
        </p>

        <div class="countdown">
            <span id="seconds">15</span> seconds
        </div>

        <div class="actions" style="margin-top: 22px;">
            <a href="/" class="secondary-button">
                Return to Dashboard
            </a>
        </div>
    </section>

</div>

<script>
    let seconds = 15;
    const output = document.getElementById("seconds");

    const timer = setInterval(() => {
        seconds -= 1;

        if (seconds >= 0) {
            output.textContent = seconds;
        }

        if (seconds <= 0) {
            clearInterval(timer);
        }
    }, 1000);
</script>
</body>
</html>
